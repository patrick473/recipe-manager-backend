spring.application.name=recipe-manager

# H2 in-memory database (dev)
spring.datasource.url=jdbc:h2:mem:recipedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (dev convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# Recipe hero image uploads
app.storage.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Tomcat's default max-swallow-size (2MB) is smaller than the gap between an
# oversized upload and the 5MB limit above; without raising it, Tomcat can't
# fully "swallow" the rejected request body and just resets the connection
# instead of returning the clean 400 ProblemDetail from GlobalExceptionHandler.
server.tomcat.max-swallow-size=10MB

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
